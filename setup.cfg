[metadata]
name = dancing-angels-ai
version = 0.2.0
description = Animate a character image from a driver motion video.
long_description = file: README.md
long_description_content_type = text/markdown

[options]
package_dir =
    = src
packages = find:
python_requires = >=3.9

[options.packages.find]
where = src

[options.package_data]
dancing_angels_ai = py.typed
dancing_angels_ai.api = model-reference.json

[options.extras_require]
api =
    fastapi>=0.140,<0.141
    starlette>=1.3.1,<1.4
    uvicorn>=0.51,<0.52
    python-multipart>=0.0.32,<0.1
    Pillow>=12.3,<13

[options.entry_points]
console_scripts =
    dancing-angels-ai = dancing_angels_ai.cli:main

[tool:pytest]
testpaths = tests
pythonpath = src
